# Боевой и тестовый стенд: сайт + PostgreSQL + Caddy (HTTPS-сертификат выпускается сам).
# Запуск на сервере:  docker compose -f docker-compose.prod.yml up -d --build
# Переменные — в файле .env рядом (образец: .env.example).
services:
  db:
    image: mirror.gcr.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prodservis
      POSTGRES_USER: prodservis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prodservis -d prodservis']
      interval: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://prodservis:${POSTGRES_PASSWORD}@db:5432/prodservis
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Задайте PAYLOAD_SECRET в .env}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    volumes:
      - media:/app/media
      - private-uploads:/app/private-uploads
      - private-imports:/app/private-imports

  caddy:
    image: mirror.gcr.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Задайте SITE_DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  pgdata:
  media:
  private-uploads:
  private-imports:
  caddy-data:
