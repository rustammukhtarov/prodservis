# Проверка и выкладка на сервер при каждом изменении ветки main.
#
# Секреты репозитория (Settings → Secrets and variables → Actions → New repository secret):
#   DEPLOY_HOST     — IP-адрес сервера (обязательно; пока не задан — выкладки нет, только проверка)
#   DEPLOY_SSH_KEY  — закрытый SSH-ключ (обязательно)
#   DEPLOY_USER     — пользователь на сервере (необязательно, по умолчанию root)
#   SITE_DOMAIN     — домен стенда, например test.prodmsk.ru (необязательно; без него сайт работает по http://IP)
#
# Первая выкладка сама ставит Docker, создаёт файл подкачки и .env со случайными паролями.
name: Проверка и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npx vitest run --config ./vitest.config.mts tests/int/pricing.int.spec.ts tests/int/priceContext.int.spec.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образа (проверка, без публикации)
        run: docker build --build-arg NEXT_PUBLIC_SERVER_URL=https://example.ru -t prodservis:ci .

  deploy:
    needs: [check, docker]
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Выкладка не настроена
        if: env.HOST == ''
        run: echo "Секрет DEPLOY_HOST не задан — выкладка пропущена."

      - uses: actions/checkout@v4
        if: env.HOST != ''

      - name: Упаковка кода
        if: env.HOST != ''
        run: tar --exclude=.git --exclude=site.tgz -czf site.tgz .

      - name: Копирование на сервер
        if: env.HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: site.tgz
          target: /tmp/prodservis-release

      - name: Установка и запуск
        if: env.HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SITE_DOMAIN
          command_timeout: 40m
          script: |
            set -e
            tar -xzf /tmp/prodservis-release/site.tgz -C /tmp/prodservis-release ./deploy/server.sh
            SITE_DOMAIN="$SITE_DOMAIN" bash /tmp/prodservis-release/deploy/server.sh
