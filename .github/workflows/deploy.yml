# Проверка и выкладка на сервер при каждом изменении ветки main.
#
# Секреты репозитория (Settings → Secrets and variables → Actions → New repository secret):
#   DEPLOY_HOST     — IP-адрес сервера (обязательно; пока не задан — выкладки нет, только проверка)
#   DEPLOY_SSH_KEY  — закрытый SSH-ключ (обязательно)
#   DEPLOY_USER     — пользователь на сервере (необязательно, по умолчанию root)
#   SITE_DOMAIN     — домен стенда, например test.prodmsk.ru (необязательно; без него сайт работает по http://IP)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM — почта для писем сайта (необязательно)
#
# Первая выкладка сама ставит Docker, создаёт файл подкачки и .env со случайными паролями.
name: Проверка и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npx vitest run --config ./vitest.config.mts tests/int/pricing.int.spec.ts tests/int/priceContext.int.spec.ts tests/int/delivery.int.spec.ts tests/int/cart.int.spec.ts tests/int/rateLimit.int.spec.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка конфигурации Caddy (по IP и по домену)
        run: |
          for mode in ":80|" "test.example.ru|"; do
            docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e SITE_DOMAIN="${mode%%|*}" -e CADDY_TLS="${mode#*|}" \
              mirror.gcr.io/library/caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Сборка Docker-образа
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then URL="https://$SITE_DOMAIN"; elif [ -n "$HOST" ]; then URL="http://$HOST"; else URL="https://example.ru"; fi
          docker build --build-arg NEXT_PUBLIC_SERVER_URL="$URL" -t prodservis-app:latest .
          docker save prodservis-app:latest | gzip -1 > image.tgz
          ls -lh image.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tgz
          retention-days: 3

  deploy:
    needs: [check, docker]
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Выкладка не настроена
        if: env.HOST == ''
        run: echo "Секрет DEPLOY_HOST не задан — выкладка пропущена."

      - uses: actions/checkout@v4
        if: env.HOST != ''

      - uses: actions/download-artifact@v4
        if: env.HOST != ''
        with:
          name: image

      - name: Упаковка файлов запуска
        if: env.HOST != ''
        run: tar -czf site.tgz docker-compose.prod.yml Caddyfile deploy .env.example

      - name: Копирование на сервер
        if: env.HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: site.tgz,image.tgz
          target: /tmp/prodservis-release

      - name: Установка и запуск
        if: env.HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          PUBLIC_HOST: ${{ secrets.DEPLOY_HOST }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SITE_DOMAIN,PUBLIC_HOST,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM
          command_timeout: 40m
          script: |
            set -e
            tar -xzf /tmp/prodservis-release/site.tgz -C /tmp/prodservis-release deploy/server.sh
            SITE_DOMAIN="$SITE_DOMAIN" PUBLIC_HOST="$PUBLIC_HOST" SMTP_HOST="$SMTP_HOST" SMTP_PORT="$SMTP_PORT" SMTP_USER="$SMTP_USER" SMTP_PASS="$SMTP_PASS" SMTP_FROM="$SMTP_FROM" bash /tmp/prodservis-release/deploy/server.sh

      - name: Проверка снаружи
        if: env.HOST != ''
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then BASE="https://$SITE_DOMAIN"; else BASE="http://$HOST"; fi
          ok=1
          https=$(curl -sk -o /dev/null -m 20 -w '%{http_code}' "https://$HOST/admin" || echo 000)
          report="https/admin=$https"
          for path in / /admin /api/globals/site-settings; do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$BASE$path" || echo 000)
            echo "$path → $code"
            report="$report $path=$code"
            case "$code" in 2*|3*) ;; *) ok=0 ;; esac
          done
          if [ $ok = 1 ]; then echo "::notice title=Сайт доступен снаружи::$report"; else echo "::error title=Сайт снаружи недоступен::$report"; exit 1; fi
