# Проверка и выкладка на тестовый стенд при каждом изменении ветки main.
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST — адрес сервера, DEPLOY_USER — пользователь, DEPLOY_SSH_KEY — закрытый SSH-ключ.
# Пока секреты не заданы, выполняется только проверка (тесты и типы).
name: Проверка и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npx vitest run --config ./vitest.config.mts tests/int/pricing.int.spec.ts tests/int/priceContext.int.spec.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образа (проверка, без публикации)
        run: docker build --build-arg NEXT_PUBLIC_SERVER_URL=https://example.ru -t prodservis:ci .

  deploy:
    needs: [check, docker]
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    concurrency: deploy
    steps:
      - name: Выкладка на сервер
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/prodservis
            git fetch --depth 1 origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
