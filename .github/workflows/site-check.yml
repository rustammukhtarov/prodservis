name: Проверка сайта снаружи
on:
  push:
    branches: [site-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          n() { echo "::notice title=$1::$2"; }
          for u in https://prodmskshop.ru/ https://prodmskshop.ru/admin https://prodmskshop.ru/catalog https://prodmskshop.ru/register https://prodmskshop.ru/api/globals/site-settings http://prodmskshop.ru/ https://www.prodmskshop.ru/ http://147.45.245.70/; do
            r=$(curl -s -o /dev/null -m 20 -w '%{http_code} -> %{redirect_url}' "$u" || echo "000")
            n "$u" "$r"
          done
          cert=$(echo | timeout 15 openssl s_client -connect prodmskshop.ru:443 -servername prodmskshop.ru 2>/dev/null | openssl x509 -noout -issuer -enddate 2>/dev/null | tr '\n' ' ')
          n "Сертификат" "${cert:-нет}"
          h=$(curl -sI -m 20 https://prodmskshop.ru/ | grep -iE 'strict-transport|x-frame|x-content|referrer' | tr '\r\n' '  ')
          n "Заголовки" "${h:-нет}"
  server:
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /root/prodservis
            n() { printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | tr '\n' ' ' | cut -c1-3000)"; }
            n "сеть" "ya.ru: $(curl -s -o /dev/null -m 8 -w '%{http_code}' https://ya.ru || echo fail); smtp465: $(timeout 8 bash -c '</dev/tcp/smtp.timeweb.ru/465' && echo open || echo closed)"
            set -a; . ./.env; set +a
            n "env" "SITE_DOMAIN=${SITE_DOMAIN:-нет} SMTP_HOST=${SMTP_HOST:-нет} SMTP_PORT=${SMTP_PORT:-нет} SMTP_USER=${SMTP_USER:+есть} SMTP_PASS=${SMTP_PASS:+есть} SMTP_FROM=${SMTP_FROM:+есть}"
            docker compose -f docker-compose.prod.yml restart caddy >/dev/null 2>&1
            sleep 40
            n "caddy" "$(docker compose -f docker-compose.prod.yml logs --since 2m caddy 2>&1 | grep -iE 'certificate obtained|error|obtain' | tail -5 | cut -c1-400)"
            printf 'From: Prodservis <%s>\r\nTo: %s\r\nSubject: =?UTF-8?B?%s?=\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n%s\r\n' "$SMTP_FROM" "$SMTP_USER" "$(printf 'Тестовое письмо с сайта prodmskshop.ru' | base64 -w0)" "Проверка отправки почты с сервера сайта. Если вы это читаете, почта работает." > /tmp/t.eml
            r=$(curl -s -S --max-time 30 --url "smtps://${SMTP_HOST}:465" --ssl-reqd --mail-from "$SMTP_FROM" --mail-rcpt "$SMTP_USER" --user "$SMTP_USER:$SMTP_PASS" -T /tmp/t.eml 2>&1 && echo OK); rm -f /tmp/t.eml
            n "почта" "${r:-пусто}"
            n "контейнеры" "$(docker compose -f docker-compose.prod.yml ps --format '{{.Service}}={{.Status}}' | tr '\n' ' ')"
