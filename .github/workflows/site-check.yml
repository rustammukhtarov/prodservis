name: Проверка секретов почты
on:
  push:
    branches: [site-check]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - env:
          A: ${{ secrets.SMTP_HOST }}
          B: ${{ secrets.SMTP_PORT }}
          C: ${{ secrets.SMTP_USER }}
          D: ${{ secrets.SMTP_PASS }}
          E: ${{ secrets.SMTP_FROM }}
          F: ${{ secrets.SITE_DOMAIN }}
        run: |
          s() { [ -n "$2" ] && echo "$1=есть(${#2} симв.)" || echo "$1=ПУСТО"; }
          echo "::notice title=секреты::$(s SMTP_HOST "$A") $(s SMTP_PORT "$B") $(s SMTP_USER "$C") $(s SMTP_PASS "$D") $(s SMTP_FROM "$E") $(s SITE_DOMAIN "$F")"
