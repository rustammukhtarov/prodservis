name: Проверка сайта снаружи
on:
  push:
    branches: [site-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          n() { echo "::notice title=$1::$2"; }
          for u in https://prodmskshop.ru/ https://prodmskshop.ru/admin https://prodmskshop.ru/catalog https://prodmskshop.ru/register https://prodmskshop.ru/api/globals/site-settings http://prodmskshop.ru/ https://www.prodmskshop.ru/ http://147.45.245.70/; do
            r=$(curl -s -o /dev/null -m 20 -w '%{http_code} -> %{redirect_url}' "$u" || echo "000")
            n "$u" "$r"
          done
          cert=$(echo | timeout 15 openssl s_client -connect prodmskshop.ru:443 -servername prodmskshop.ru 2>/dev/null | openssl x509 -noout -issuer -enddate 2>/dev/null | tr '\n' ' ')
          n "Сертификат" "${cert:-нет}"
          h=$(curl -sI -m 20 https://prodmskshop.ru/ | grep -iE 'strict-transport|x-frame|x-content|referrer' | tr '\r\n' '  ')
          n "Заголовки" "${h:-нет}"
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /root/prodservis
            n() { printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | tr '\n' ' ' | cut -c1-3000)"; }
            n "env" "$(grep -E '^(SITE_DOMAIN|SITE_HOST|NEXT_PUBLIC_SERVER_URL|CADDY_HSTS|SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_FROM)=' .env)"
            n "SMTP_PASS задан" "$(grep -c '^SMTP_PASS=.\+' .env)"
            n "контейнеры" "$(docker compose -f docker-compose.prod.yml ps --format '{{.Name}} {{.Status}}')"
            n "caddy env" "$(docker compose -f docker-compose.prod.yml exec -T caddy env | grep -E 'SITE_|CADDY_')"
            n "caddy лог" "$(docker compose -f docker-compose.prod.yml logs --tail 40 caddy 2>&1 | grep -iE 'error|obtain|certificate|challenge|acme' | tail -12)"
            n "ACME доступ" "$(curl -s -o /dev/null -m 15 -w '%{http_code}' https://acme-v02.api.letsencrypt.org/directory)"
            n "smtp 465" "$(timeout 8 bash -c 'echo > /dev/tcp/smtp.timeweb.ru/465' 2>/dev/null && echo open || echo closed)"
            n "smtp 2525" "$(timeout 8 bash -c 'echo > /dev/tcp/smtp.timeweb.ru/2525' 2>/dev/null && echo open || echo closed)"
            n "app лог почта" "$(docker compose -f docker-compose.prod.yml logs --tail 200 app 2>&1 | grep -iE 'email|smtp|mail' | tail -5)"
