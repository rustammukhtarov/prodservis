name: Тестовое письмо
on:
  push:
    branches: [site-check]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /root/prodservis
            n() { printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | tr '\n' ' ' | cut -c1-1500)"; }
            set -a; . ./.env; set +a
            n "env" "SMTP_HOST=${SMTP_HOST:-нет} SMTP_PORT=${SMTP_PORT:-нет} USER=${SMTP_USER:+есть} PASS=${SMTP_PASS:+есть} FROM=${SMTP_FROM:+есть}"
            n "app-env" "$(docker compose -f docker-compose.prod.yml exec -T app sh -c 'echo SMTP_HOST=${SMTP_HOST:-нет} PASS=${SMTP_PASS:+есть}')"
            printf 'From: =?UTF-8?B?%s?= <%s>\r\nTo: %s\r\nSubject: =?UTF-8?B?%s?=\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: 8bit\r\n\r\n%s\r\n' "$(printf 'Продсервис' | base64 -w0)" "$SMTP_FROM" "$SMTP_USER" "$(printf 'Тестовое письмо с сайта prodmskshop.ru' | base64 -w0)" "Проверка отправки почты с сервера сайта https://prodmskshop.ru. Если вы читаете это письмо, почта сайта работает." > /tmp/t.eml
            r=$(curl -sS --max-time 30 --url "smtps://${SMTP_HOST}:${SMTP_PORT:-465}" --ssl-reqd --mail-from "$SMTP_FROM" --mail-rcpt "$SMTP_USER" --user "$SMTP_USER:$SMTP_PASS" -T /tmp/t.eml 2>&1 && echo OK); rm -f /tmp/t.eml
            n "почта" "${r:-пусто}"
            n "логи-почты" "$(docker compose -f docker-compose.prod.yml logs --since 48h app 2>&1 | grep -iE 'письмо|email|smtp' | tail -3 | cut -c1-300)"
