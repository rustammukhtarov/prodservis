name: Диагностика сервера
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Снаружи
        env: { HOST: "${{ secrets.DEPLOY_HOST }}" }
        run: |
          out=""
          for p in / /admin /admin/create-first-user; do
            r=$(curl -s -o /dev/null -m 20 -w '%{http_code} %{time_total}s redirect=%{redirect_url}' "http://$HOST$p" 2>&1 || true)
            out="$out$p → $r%0A"
          done
          r=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "https://$HOST/" 2>&1 || echo fail); out="${out}https:// → $r%0A"
          echo "::notice title=Снаружи::$out"
          echo "::notice title=Адрес из секрета (через пробелы)::$(echo "$HOST" | sed 's/./& /g')"
          echo "::notice title=Где находится адрес::$(curl -s -m 10 "https://ipinfo.io/$HOST/json" | tr -d '\n' )"
      - name: На сервере
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            enc() { sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
            cd ~/prodservis 2>/dev/null
            echo "::notice title=cloud-init::$( { cloud-init status --long; ls /root/prodservis-ready.txt; tail -n 15 /var/log/cloud-init-output.log; } 2>&1 | enc)"
            echo "::notice title=SSH и fail2ban::$( { sshd -T 2>/dev/null | grep -Ei '^(passwordauthentication|permitrootlogin|kbdinteractive)'; systemctl is-active fail2ban; ls /etc/ssh/sshd_config.d/; } 2>&1 | enc)"
            echo "::notice title=Обращения (последние 20)::$(docker compose -f docker-compose.prod.yml logs --since 30m caddy 2>&1 | grep -c '"request"' | enc)"
