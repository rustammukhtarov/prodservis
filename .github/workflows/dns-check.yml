name: Проверка DNS домена
on:
  push:
    branches: [dns-check]
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in MX TXT; do
            v=$(dig +short $t prodmskshop.ru @8.8.8.8 | tr '\n' ' ')
            echo "::notice title=$t prodmskshop.ru::${v:-нет}"
          done
          for h in smtp.timeweb.ru; do
            for p in 465 587 2525; do
              r=$(timeout 8 bash -c "echo > /dev/tcp/$h/$p" 2>/dev/null && echo open || echo closed)
              echo "::notice title=$h:$p::$r"
            done
          done
